services:
  - type: web
    name: lostlink
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    disk:
      name: lostlink-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lostlink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: DEMO_ADMIN_EMAIL
        value: admin@lostlink.edu
      - key: DEMO_ADMIN_PASSWORD
        sync: false

databases:
  - name: lostlink-db
    databaseName: lostlink
    user: lostlink
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: singapore