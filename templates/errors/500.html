{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
  <section class="page-error">
    <div class="container error-card">
      <span class="eyebrow">Error 500</span>
      <h1>Something went wrong. Please try again.</h1>
      <p>The system encountered an issue while processing your request.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return home</a>
    </div>
  </section>
{% endblock %}
